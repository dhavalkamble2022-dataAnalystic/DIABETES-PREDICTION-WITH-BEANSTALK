<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diabetes Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Diabetes Prediction</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <input
                type="text"
                name="Pregnancies"
                placeholder="Pregnancies"
                required="required"
            />

            <input
                type="text"
                name="Glucose"
                placeholder="Glucose"
                required="required"
            />

            <input
                type="text"
                name="BloodPressure"
                placeholder="BloodPressure"
                required="required"
            />

            <input
                type="text"
                name="SkinThickness"
                placeholder="SkinThickness"
                required="required"
            />

            <input
                type="text"
                name="Insulin"
                placeholder="Insulin"
                required="required"
            />

            <input
                type="text"
                name="BMI"
                placeholder="BMI"
                required="required"
            />

            <input
                type="text"
                name="DiabetesPedigreeFunction"
                placeholder="DiabetesPedigreeFunction"
                required="required"
            />

            <input
                type="text"
                name="Age"
                placeholder="Age"
                required="required"
            />

            <button type="submit">
                Predict
            </button>

        </form>

    </div>

</body>

</html>
